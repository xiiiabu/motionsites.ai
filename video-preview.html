    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0a0a12 0%, #1a1a2e 100%);
      color: #fff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 60px;
    }

    h1 {
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 800;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #fff 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: #8b8ba5;
      font-size: 18px;
      max-width: 600px;
      margin: 0 auto;
    }

    .selector-section {
      margin-bottom: 40px;
    }

    .section-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #fff;
    }

    .selector-wrapper {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .video-selector {
      flex: 1;
      min-width: 300px;
      padding: 16px 20px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .video-selector:hover {
      border-color: rgba(167, 139, 250, 0.5);
      background: rgba(255, 255, 255, 0.08);
    }

    .video-selector:focus {
      outline: none;
      border-color: #a78bfa;
      box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.2);
    }

    .video-selector option {
      background: #1a1a2e;
      color: #fff;
      padding: 10px;
    }

    .video-info-display {
      flex: 1;
      min-width: 300px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
    }

    .video-info-display h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #fff;
    }

    .video-info-display p {
      color: #8b8ba5;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .player-section {
      margin-bottom: 40px;
    }

    .video-player-wrapper {
      position: relative;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      aspect-ratio: 16/9;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .video-player-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #8b8ba5;
      font-size: 16px;
    }

    .error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ff6b6b;
      font-size: 16px;
      text-align: center;
    }

    .video-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag {
      padding: 4px 12px;
      background: rgba(167, 139, 250, 0.15);
      border-radius: 6px;
      font-size: 12px;
      color: #a78bfa;
    }

    .stats-section {
      display: flex;
      justify-content: center;
      gap: 60px;
      margin: 60px 0;
      padding: 40px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      display: block;
      font-size: 36px;
      font-weight: 700;
      color: #a78bfa;
      margin-bottom: 8px;
    }

    .stat-label {
      font-size: 14px;
      color: #8b8ba5;
    }

    footer {
      text-align: center;
      margin-top: 80px;
      padding: 40px 0;
      color: #8b8ba5;
      font-size: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    @media (max-width: 768px) {
      .video-grid {
        grid-template-columns: 1fr;
      }

      body {
        padding: 20px 16px;
      }
    }
  </style>
</head>

        </div>
      </div>
    </div>

    <!-- 单个视频播放器 -->
    <div class="player-section">

        <div class="error" id="mainError" style="display: none;">加载失败，请检查网络连接</div>

    </div>

      </div>
    </div>

    // 统计数据
    let loadedCount = 0;
    let failedCount = 0;

    // 初始化视频选择器
    function initVideoSelector() {
      const select = document.getElementById('videoSelect');
      
      // 添加默认选项
      const defaultOption = document.createElement('option');
      defaultOption.value = '';
      defaultOption.textContent = '-- 请选择视频 --';
      select.appendChild(defaultOption);

      // 添加所有视频选项
      videos.forEach((video, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `${video.title} - ${video.desc}`;
        select.appendChild(option);
      });

      // 更新统计
      document.getElementById('totalCount').textContent = videos.length;
      document.getElementById('footerCount').textContent = videos.length;

      // 监听选择变化
      select.addEventListener('change', handleVideoSelect);
    }

    // 处理视频选择
    function handleVideoSelect(e) {
      const index = e.target.value;
      if (index === '') {
        resetPlayer();
        return;
      }

      const video = videos[index];
      loadVideo(video);
      updateVideoInfo(video);
    }

    // 加载视频
    function loadVideo(video) {
      const mainVideo = document.getElementById('mainVideo');
      const loading = document.getElementById('mainLoading');
      const error = document.getElementById('mainError');

      // 重置状态
      loading.style.display = 'block';
      loading.textContent = '加载中...';
      error.style.display = 'none';

      // 销毁之前的 HLS 实例
      if (window.hlsInstance) {
        window.hlsInstance.destroy();
        window.hlsInstance = null;
      }

      // 检查是否是 HLS 流媒体格式
      const isHLS = video.videoUrl.includes('.m3u8') || 
                    video.videoUrl.includes('manifest') ||
                    video.videoUrl.includes('fastly.mux.com');

      if (isHLS && window.hlsSupported) {
        // 使用 HLS.js 播放
        const hls = new Hls({
          maxBufferLength: 30,
          maxMaxBufferLength: 60,
          startLevel: -1
        });

        hls.loadSource(video.videoUrl);
        hls.attachMedia(mainVideo);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          loading.style.display = 'none';
          loadedCount++;
          document.getElementById('loadedCount').textContent = loadedCount;
          console.log(`HLS 视频加载完成: ${video.title}`);
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            loading.style.display = 'none';
            error.style.display = 'block';
            failedCount++;
            document.getElementById('failedCount').textContent = failedCount;
            console.error(`HLS 视频加载失败: ${video.title}`, data);
          }
        });

        window.hlsInstance = hls;
      } else if (isHLS && mainVideo.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari 原生支持 HLS
        mainVideo.src = video.videoUrl;
        mainVideo.addEventListener('loadedmetadata', () => {
          loading.style.display = 'none';
          loadedCount++;
          document.getElementById('loadedCount').textContent = loadedCount;
        });
      } else {
        // 普通 MP4/WebM 格式
        mainVideo.src = video.videoUrl;

        // 视频加载完成
        mainVideo.addEventListener('loadeddata', () => {
          loading.style.display = 'none';
          loadedCount++;
          document.getElementById('loadedCount').textContent = loadedCount;
          console.log(`视频加载完成: ${video.title}`);
        });

        // 视频可以播放
        mainVideo.addEventListener('canplay', () => {
          loading.style.display = 'none';
        });

        // 视频加载错误
        mainVideo.addEventListener('error', (e) => {
          loading.style.display = 'none';
          error.style.display = 'block';
          failedCount++;
          document.getElementById('failedCount').textContent = failedCount;
          console.error(`视频加载失败: ${video.title}`, e);
        });
      }
    }

    // 更新视频信息显示
    function updateVideoInfo(video) {
      document.getElementById('currentTitle').textContent = video.title;
      document.getElementById('currentDesc').textContent = video.desc;
      
      const tagsContainer = document.getElementById('currentTags');
      tagsContainer.innerHTML = video.tags.map(tag => 
        `<span class="tag">${tag}</span>`
      ).join('');
    }

    // 重置播放器
    function resetPlayer() {
      const mainVideo = document.getElementById('mainVideo');
      const loading = document.getElementById('mainLoading');
      const error = document.getElementById('mainError');

      mainVideo.src = '';
      loading.style.display = 'block';
      loading.textContent = '选择视频后自动加载';
      error.style.display = 'none';

      document.getElementById('currentTitle').textContent = '选择一个视频开始播放';
      document.getElementById('currentDesc').textContent = '从下拉列表中选择您想观看的视频';
      document.getElementById('currentTags').innerHTML = '';
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', () => {
      initVideoSelector();
    });
  </script>
